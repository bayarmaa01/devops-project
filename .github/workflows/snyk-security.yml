name: Snyk AI Security Analysis

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]
  schedule:
    - cron: '0 2 * * *'  # Daily at 2 AM UTC
  workflow_dispatch:

jobs:
  snyk-security:
    name: Snyk AI-Powered Vulnerability Scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
      
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run Snyk to check for vulnerabilities
        uses: snyk/actions/node@master
        continue-on-error: true
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        with:
          args: --severity-threshold=high --all-projects

      - name: Upload Snyk results to GitHub Security
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: snyk.sarif

      - name: Run Snyk Test and Generate Report
        uses: snyk/actions/node@master
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        with:
          command: test
          args: --json-file-output=snyk-report.json

      - name: Upload Snyk Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: snyk-ai-security-report
          path: snyk-report.json
          retention-days: 30

      - name: Generate AI Analysis Summary
        if: always()
        run: |
          cat > snyk-ai-summary.md << 'SUMMARY'
          # 🤖 Snyk AI Security Analysis Report
          
          ## AI-Powered Vulnerability Detection
          
          **Analysis Date:** $(date)
          **Scan Type:** Machine Learning Enhanced Security Analysis
          
          ### How Snyk AI Works:
          
          1. **Deep Learning Analysis**
             - Trained on 4+ million open source projects
             - Analyzes dependency vulnerabilities using ML models
             - Reduces false positives by 70% compared to traditional scanners
          
          2. **Intelligent Risk Prioritization**
             - ML-based severity scoring
             - Exploit maturity assessment
             - Reachability analysis (is vulnerable code actually used?)
             - Business impact prediction
          
          3. **Automated Fix Suggestions**
             - Context-aware remediation recommendations
             - Code-level fix examples
             - Version upgrade suggestions
             - Automated pull request generation capability
          
          ### Scan Coverage:
          - ✅ Direct dependencies (package.json)
          - ✅ Transitive dependencies (all nested packages)
          - ✅ Known CVE database (updated daily)
          - ✅ Security advisories
          
          ### AI Advantages:
          - **Accuracy:** 95%+ detection rate
          - **Speed:** Real-time analysis (30-60 seconds)
          - **Intelligence:** Context-aware prioritization
          - **Automation:** Reduces manual security reviews
          
          ### View Detailed Results:
          - GitHub Security Tab: [View Security Alerts](https://github.com/${{ github.repository }}/security)
          - Snyk Dashboard: [View in Snyk](https://app.snyk.io)
          - Download artifact: snyk-ai-security-report
          
          ---
          *Powered by Snyk AI - Machine Learning for Application Security*
          SUMMARY
          
          cat snyk-ai-summary.md

      - name: Upload AI Summary
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: snyk-ai-analysis-summary
          path: snyk-ai-summary.md

      - name: Comment on PR with AI Analysis
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: '🤖 **Snyk AI Security Scan Complete**\n\n✅ Machine learning analysis finished\n📊 Check artifacts for detailed AI-generated report\n🔒 View results in Security tab'
            })