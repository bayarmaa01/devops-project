name: Continuous Deployment

on:
  push:
    branches: [ main ]
  workflow_dispatch:

env:
  DOCKER_IMAGE: saas-app
  NODE_VERSION: '18'

jobs:
  pre-deployment-tests:
    name: Pre-Deployment Tests
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
      - run: npm ci
      - run: npm test

  build-and-push:
    name: Build & Push Docker Image
    runs-on: ubuntu-latest
    needs: pre-deployment-tests
    outputs:
      image-tag: ${{ steps.image-tag.outputs.tag }}
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Generate image tag
        id: image-tag
        run: |
          TAG=${GITHUB_SHA::8}
          echo "tag=${{ secrets.DOCKER_USERNAME }}/${{ env.DOCKER_IMAGE }}:${TAG}" >> $GITHUB_OUTPUT

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ steps.image-tag.outputs.tag }}
            ${{ secrets.DOCKER_USERNAME }}/${{ env.DOCKER_IMAGE }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy-staging:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    needs: build-and-push
    environment:
      name: staging
      url: https://devops-project-2-85kl.onrender.com
    
    steps:
      - run: |
          echo "🚀 Deploying to staging..."
          echo "📦 Image: ${{ needs.build-and-push.outputs.image-tag }}"
          echo "✅ Staging deployment completed (simulated)"

  deploy-production:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: [build-and-push, deploy-staging]
    environment:
      name: production
      url: https://devops-project-2-85kl.onrender.com
    
    steps:
      - run: |
          echo "🚀 Deploying to production..."
          echo "📦 Image: ${{ needs.build-and-push.outputs.image-tag }}"
          echo "✅ Production deployment completed (simulated)"